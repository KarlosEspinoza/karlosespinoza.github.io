  <g transform="translate(52,199)">
    <rect x="0.5" y="0.5" width="811" height="128" rx="8" fill="#ffffff" stroke="#b8b8b8"/>
    <rect x="1" y="1" width="810" height="38" rx="8" fill="#f3f3f3"/>
    <rect x="1" y="28" width="810" height="11" fill="#f3f3f3"/>
    <rect x="16" y="12" width="15" height="14" rx="2" fill="#f7c873" stroke="#d9a441"/>
    <text class="t win" x="42" y="25">taller</text>
