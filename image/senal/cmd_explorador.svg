    <rect x="14" y="88" width="700" height="30" rx="4" fill="#fbfbfb" stroke="#d33a3a" stroke-width="2"/>
    <text class="t bc" x="26" y="109" fill="#333">Escritorio  &#8250;  taller</text>
  </g>

  <!-- paso 2 -->
  <circle cx="20" cy="245" r="16" fill="#d33a3a"/>
