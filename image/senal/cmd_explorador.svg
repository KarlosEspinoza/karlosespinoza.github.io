    <line x1="1" y1="39" x2="811" y2="39" stroke="#e0e0e0"/>
    <text class="t win" x="16" y="62" fill="#333">Nuevo</text>
    <text class="t win" x="80" y="62" fill="#333">Copiar</text>
    <text class="t win" x="148" y="62" fill="#333">Pegar</text>
