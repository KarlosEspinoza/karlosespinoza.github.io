<svg xmlns="http://www.w3.org/2000/svg" fill="#1a1a1a" viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="Como abrir el CMD desde la barra de direcciones del explorador de archivos de Windows">
  <style>
    .t   { font-family: "Segoe UI", Selawik, system-ui, sans-serif; }
    .win { font-size: 14px; }
    .bc  { font-size: 15px; }
    .mono{ font-family: Consolas, "Courier New", monospace; font-size: 15px; }
    .num { font-family: "Segoe UI", Selawik, system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- paso 1 -->
  <circle cx="20" cy="60" r="16" fill="#d33a3a"/>
