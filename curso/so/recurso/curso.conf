# Configuracion del curso IN235 Fundamentos de Sistemas Operativos para los
# scripts genericos de curso/recursos/. Ver curso/recursos/README.md.

CURSO=so

# Repositorio individual del alumno (semana 01, privado, con el asesor como
# colaborador).
REPO_INDIVIDUAL=so-proyecto

# Repositorio del proyecto integrador, uno por equipo, creado por el
# representante.
REPO_EQUIPO=integrador-so

# Repositorio privado de autoevaluacion entre pares de cada alumno
# (evaluacion/proyecto_integrador, seccion Autoevaluacion del equipo).
REPO_AUTOEVAL=autoeval-so

COLABORADOR=KarlosEspinoza

# Carpeta de datos del ciclo en curso. Se actualiza una vez por ciclo.
DIR_CICLO="$HOME/curso/so/202620"

PLANTILLA_INDIVIDUAL="$RECURSO_CURSO/revision/plantilla-individual.md"
PLANTILLA_EQUIPO="$RECURSO_CURSO/revision/plantilla-equipo.md"
