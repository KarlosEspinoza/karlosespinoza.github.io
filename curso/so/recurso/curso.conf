# Configuracion del curso IN235 Fundamentos de Sistemas Operativos para los
# scripts genericos de curso/recursos/. Ver curso/recursos/README.md.

CURSO=so

# Repositorio individual del alumno (semana 01, privado, con el asesor como
# colaborador).
REPO_INDIVIDUAL=so-proyecto

# Repositorio del proyecto integrador, uno por equipo, creado por el
# representante.
REPO_EQUIPO=integrador-so

# Repositorio donde cada alumno deja su <codigo>.csv de autoevaluacion entre
# pares (evaluacion/proyecto_integrador, seccion Autoevaluacion). En SO 2026B
# se les indico ponerlo en la raiz de su repo individual, que es privado y
# solo lo ve el asesor, en vez de un repo aparte.
REPO_AUTOEVAL=so-proyecto

COLABORADOR=KarlosEspinoza

# Carpeta de datos del ciclo en curso. Se actualiza una vez por ciclo.
DIR_CICLO="$HOME/curso/so/202620"

# Preguntas orales de las revisiones (curso/recursos/preguntas/preguntar.py).
# El banco trae las respuestas: vive en el repo privado so-profesor.
BANCO_PREGUNTAS="$HOME/gh/so-profesor/banco"
REVISION_1_SEMANAS=1-8
REVISION_2_SEMANAS=10-13
REVISION_3_SEMANAS=15-16
# Una letra por pregunta: p=proyecto, f=facil, d=dificil, ?=se elige con
# cada alumno. Una sobre su propio trabajo y una de los temas.
PREGUNTAS_TIPOS="p ?"

PLANTILLA_INDIVIDUAL="$RECURSO_CURSO/revision/plantilla-individual.md"
PLANTILLA_EQUIPO="$RECURSO_CURSO/revision/plantilla-equipo.md"
